name: Build and Verify Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "android/**"
      - ".github/workflows/android-debug-apk.yml"
  pull_request:
    branches:
      - main
      - master
    paths:
      - "android/**"
      - ".github/workflows/android-debug-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build & Verify (Debug & Release)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Install Android SDK components
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      # Consistently provision Gradle 8.9
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Execute Unit Tests
      - name: Run Unit Tests
        id: unit_tests
        run: |
          cd android
          gradle --no-daemon testDebugUnitTest

      # Execute Lint (continues on error so APK build is attempted, but outcome is tracked)
      - name: Run Lint
        id: lint
        continue-on-error: true
        run: |
          cd android
          gradle --no-daemon lintDebug

      # Upload Lint reports (always runs if lint step was reached)
      - name: Upload Lint Reports
        if: always() && steps.unit_tests.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: SysHush-lint-reports
          path: |
            android/app/build/reports/lint-results-debug.*
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 14

      # Build Debug APK (runs even if Lint failed)
      - name: Build Debug APK
        id: build_debug
        if: steps.unit_tests.outcome == 'success'
        run: |
          cd android
          gradle --no-daemon assembleDebug

      # Upload Debug APK artifact
      - name: Upload Debug APK
        if: steps.build_debug.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: SysHush-debug-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # Build Release APK (runs even if Lint failed)
      - name: Build Release APK
        id: build_release
        if: steps.unit_tests.outcome == 'success'
        run: |
          cd android
          gradle --no-daemon assembleRelease

      # Upload Release APK artifact
      - name: Upload Release APK
        if: steps.build_release.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: SysHush-release-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      # Enforce overall job success: fails job if Lint or either APK build failed
      - name: Verify All Quality Gates Passed
        if: always()
        run: |
          LINT_OUTCOME="${{ steps.lint.outcome }}"
          DEBUG_OUTCOME="${{ steps.build_debug.outcome }}"
          RELEASE_OUTCOME="${{ steps.build_release.outcome }}"
          echo "Lint Outcome: $LINT_OUTCOME"
          echo "Debug Build Outcome: $DEBUG_OUTCOME"
          echo "Release Build Outcome: $RELEASE_OUTCOME"
          if [ "$LINT_OUTCOME" != "success" ]; then
            echo "::error::Lint check failed! Review uploaded SysHush-lint-reports artifact for details."
            exit 1
          fi
          if [ "$DEBUG_OUTCOME" != "success" ]; then
            echo "::error::Debug APK build failed!"
            exit 1
          fi
          if [ "$RELEASE_OUTCOME" != "success" ]; then
            echo "::error::Release APK build failed!"
            exit 1
          fi
          echo "All quality gates passed successfully!"
