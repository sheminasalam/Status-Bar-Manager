name: Build and Verify Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "android/**"
      - ".github/workflows/android-debug-apk.yml"
  pull_request:
    branches:
      - main
      - master
    paths:
      - "android/**"
      - ".github/workflows/android-debug-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build & Verify (Debug & Release)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Install Android SDK components
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      # Consistently provision Gradle 8.9
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Execute Unit Tests
      - name: Run Unit Tests
        run: |
          cd android
          gradle --no-daemon testDebugUnitTest

      # Execute Lint
      - name: Run Lint
        run: |
          cd android
          gradle --no-daemon lintDebug

      # Build both Debug and Release APKs
      - name: Build Debug & Release APKs
        run: |
          cd android
          gradle --no-daemon clean assembleDebug assembleRelease

      # Upload Debug APK artifact
      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SysHush-debug-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # Upload Release APK artifact
      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SysHush-release-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
